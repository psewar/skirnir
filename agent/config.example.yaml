# skirnir-agent - Beispielkonfiguration fuer einen neuen GPU-Rechner
# =====================================================================
# Der Agent meldet den Rechner beim Skirnir-Router an. Er braucht KEINEN Token, keine Firewall-Regel,
# kein Zertifikat und keine IP/MAC von Hand: beim ersten Start erzeugt er ein Schluesselpaar, meldet
# Hostname, GPU, VRAM und MAC selbst und wartet, bis der Knoten in der Router-UI freigegeben ist.
# Nach der Freigabe schickt der Router den MQTT-Zugang fuer das HA-Geraet durch den Tunnel.
#
# Voraussetzungen auf dem Rechner
#   - NVIDIA-Treiber (nvidia-smi funktioniert), Ollama installiert und gestartet (darf auf localhost bleiben),
#     gewuenschte Modelle einmal gepullt (der Router routet nur Rollen, deren Modelle der Knoten hat)
#   - Netzwerkzugang zu https://router.example.net:11435
#
# ---------------------------------------------------------------------
# WINDOWS (seit 0.10.0: Doppelklick)
#   1. skirnir-agent.exe aus dem GitHub-Release irgendwohin legen und doppelklicken (oder `skirnir-agent.exe setup`).
#      Windows fragt nach Adminrechten; danach drei Fragen: Router-Adresse, Update-Schluessel des Betreibers (optional),
#      Benutzer, der den Dienst ohne Adminrechte steuern darf. Das war's: Konfiguration unter
#      C:\ProgramData\skirnir-agent\config.yaml, Binary in C:\Program Files\skirnir-agent\, Dienst "Skirnir Agent"
#      (technischer Name SkirnirAgent, LocalSystem, Autostart, Neustart bei Absturz), GPU-Z-Relay-Aufgabe,
#      Schluessel unter ...\identity\ (DPAPI), Logs unter ...\logs\. Bei bestehender Installation: Update in place.
#   2. Router-UI https://router.example.net:11435  -> Tab "Agenten" -> freigeben
#   Diese Datei braucht nur, wer mehr einstellen will (Kinder, Firewall, MQTT lokal): nach ...\config.yaml und setup erneut.
#   Install-Service.ps1 bleibt fuer Sonderfaelle (alte Tasks entfernen, Firewall-Regeln des Ollama-Installers).
#      (dabei WOL erlauben ja/nein, Gewicht, MQTT-Geraet in HA). HA kann neue Knoten per Benachrichtigung melden.
#   Nuetzlich (ohne Admin): skirnir-agent.exe status | identity | restart
#   Update: seit 0.8.0 ueber den Router (update.public_key unten, Knopf/Rollout in der Router-UI); von Hand: neue Binary
#           nach dist\, Install-Service.ps1 erneut als Administrator.
#
# LINUX (systemd): `sudo skirnir-agent setup --router https://router.example.net:11435` does all of the following
#   (ADR-0070: configuration with identity/logging folders under /var, folders, binary, unit, start). By hand:
#   1. Binary:  sudo install -D -m 755 skirnir-agent-linux-amd64 /opt/skirnir-agent/skirnir-agent
#               sudo ln -sf /opt/skirnir-agent/skirnir-agent /usr/local/bin/skirnir-agent   (ADR-0084)
#   2. Config:  sudo mkdir -p /etc/skirnir-agent && sudo cp config.yaml /etc/skirnir-agent/config.yaml
#               (identity.dir und logging.dir unten fuer Linux setzen, siehe Kommentare)
#   3. Unit:    sudo cp skirnir-agent.service /etc/systemd/system/
#               sudo systemctl daemon-reload && sudo systemctl enable --now skirnir-agent
#   4. Router-UI -> "Registrierte Agenten" -> freigeben
#   Pruefen:    skirnir-agent status --config /etc/skirnir-agent/config.yaml ; journalctl -u skirnir-agent -f
#   Hinweis: Dienstinstallation per Verb (install/apply-rules) und DPAPI gibt es nur unter Windows; unter Linux liegt der
#            Schluessel als Datei mit Modus 0600 im identity.dir.
#
# WAKE-ON-LAN: der Rechner muss es selbst koennen (BIOS + Netzwerkadapter "Wake on Magic Packet"); die MAC kennt der
#              Router vom Agenten, die Erlaubnis setzt du bei der Freigabe.
# ---------------------------------------------------------------------

# node: mein-rechner            # Knotenname im Router; leer = Hostname in Kleinbuchstaben

router:
  url: https://router.example.net:11435     # einzige Pflichtangabe
  # token: ...                              # nur fuer die TLS-Vorschaltstelle ollama_proxy (X-Router-Token)
  # ca_file: /etc/skirnir-agent/router-ca.pem   # private CA of the router's certificate, trusted in addition to the
  #                                            # system store for tunnel and updates (ADR-0070); empty = system store only

# ollama_proxy:                                 # TLS-Vorschaltstelle vor Ollama (Alternative ohne Tunnel; braucht router.token)
#   enabled: true
#   listen: 0.0.0.0:11443
#   upstream: http://127.0.0.1:11434
#   cert_dir: C:\ProgramData\skirnir-agent\tls
#   require_token: true                         #   false = ohne X-Router-Token (nur in abgeschottetem Netz)

tunnel:                                         # ausgehende Verbindung zum Router (einziger Weg seit 0.9.1)
  upstream: http://127.0.0.1:11434              # lokales Ollama, das der Router durch den Tunnel aufruft
  # upstream_api: openai                        # Standard ollama. openai = OpenAI-kompatibler Server statt Ollama (z. B. Strata):
  #                                             #   upstream dann z. B. http://127.0.0.1:8080, Modelle kommen aus /v1/models,
  #                                             #   der Router schickt Chats als /v1/chat/completions. Den Server als Kind
  #                                             #   (children) eintragen und das Ollama-Kind abschalten: beide brauchen die GPU.
  # upstream_child: strata                      # nur mit upstream_api: openai - das Kind, das den Server betreibt. Dann haelt
  #                                             #   der Router ihn an, wenn der Knoten busy wird (Spiel), und startet ihn
  #                                             #   wieder, wenn er frei ist oder eine Anfrage das Modell braucht.
  # routes:                                    # optional: weitere lokale Dienste nach Pfad; ohne routes geht alles an upstream
  #   - name: rerank                            #   Schluessel im Heartbeat-Feld routes: {rerank: {up, reason}}
  #     path: /rerank                           #   exakter Pfadvergleich (ohne Query)
  #     methods: [POST]                         #   andere Methoden beantwortet der Agent mit 405
  #     upstream: http://127.0.0.1:8090         #   nur 127.0.0.1 oder [::1], sonst laedt die Config nicht
  #     health: /health                         #   alle 5 s abgefragt; 200 = up, sonst Grund starting/selftest_failed/unhealthy/unreachable

# gpuz:                                         # GPU-Z-Sensoren (Windows) als Zusatzquelle, Standard an: laeuft GPU-Z,
#   enabled: false                              #   kommen Speichertemperatur, Hot Spot, Spannung, 16-Pin-Leistung dazu

# update:                                       # Selbst-Update ueber den Router (Standard an); Schluessel zeigt `deploy.py --agent`
#   public_key: <base64 Ed25519>                #   ohne public_key lehnt der Agent jeden Auftrag ab
#   public_keys: [<base64 Ed25519>]            #   weitere vertraute Schluessel fuer den Schluesselwechsel (ADR-0058)
#   allow_downgrade: true                       #   NUR fuer einen bewussten Rueckschritt: aeltere signierte Version zulassen (ADR-0054)
#   enabled: false

# ollama_update:                                # Ollama-Update ueber den Router (0.12.0; nur wenn Ollama ein Kind ist, s. children)
#   enabled: false                              #   Standard an; der Agent laedt das Release-Archiv selbst von `source`
#   source: https://github.com/ollama/ollama/releases/download/   # <source>v<version>/<datei> + sha256sum.txt (interner Spiegel moeglich)
#   allow_downgrade: false                    # aeltere Version oder Vorabversion nur mit true (bewusstes Zurueckgehen, ADR-0073)

# gpu_guard:                                    # GPU-Schutz (12V-2x6-Stecker): Power-Limit 80 % des Standards, Stufe 2 bei
#   enabled: false                              #   Dauer-Vollast, Spannungs-/Temperaturwarnung. Standard AN; false = abgewaehlt
#   power_limit_pct: 80                         #   (zaehlt als Problem in HA). Alle Schluessel: agent/README.md, Abschnitt GPU-Schutz

# identity:
#   dir: /var/lib/skirnir-agent           # Linux; Windows-Standard: C:\ProgramData\skirnir-agent\identity
# logging:
#   dir: /var/log/skirnir-agent           # Linux; Windows-Standard: C:\ProgramData\skirnir-agent\logs
# health:
#   listen: 127.0.0.1:10398                     # /health fuer 'status'; POST /restart-child braucht X-Agent-Token (control.token neben der Config)
# logging:
#   max_size_mb: 5                              # Rotation je Logdatei (agent.log, <kind>.log), max_backups Dateien
#   max_backups: 10
#   debug: false

# mqtt:                                         # kommt nach der Freigabe vom Router; lokal nur zum Ueberschreiben:
#   enabled: false                              #   ... oder um das HA-Geraet fuer diesen Rechner abzuschalten
#   host: mqtt.example.net                      #   lokale Angaben gewinnen ueber das Provisionierte
#   port: 1883                                  #   8883 mit tls: true
#   tls: false
#   username: ...
#   password: ...
#   password_secret: MQTT_PASSWORD              #   statt password: Schluesselname im Secret-Store (Block secret_store unten)
#   device_id: mein_rechner                     #   HA-Geraet (Standard: Knotenname mit _), device_name, manufacturer, model
#   discovery_prefix: homeassistant
#   interval_s: 30                              #   Meldeintervall des HA-Geraets
#   ollama_url: http://127.0.0.1:11434          #   fuer die Modell-Entitaeten
#   alias_model: assist:latest                  #   optional: Alias-Modell, das der Knoten fuehrt -> zwei HA-Entitaeten (Basismodell, strukturfaehig)
#   stt_child: stt                              #   welches Kind der STT-Server ist (Entitaet), stt_fallback_port: 10300
# secret_store:                                 # nur mit mqtt.password_secret: Universal-Auth-API (Client-ID/-Secret -> Token)
#   domain: https://secrets.example.net         #   Pflicht, wenn password_secret gesetzt ist (kein Platzhalter mehr)
#   project_id: 00000000-0000-0000-0000-000000000000
#   environment: prod
#   secret_path: /
#   client_id: ...
#   client_secret: ...

# children:                                     # optionale Kindprozesse, die der Agent startet/ueberwacht (Beispiel: ein STT-Server)
#   - name: stt
#     # enabled: false                          # Eintrag behalten, aber nicht starten
#     cmd: 'C:\Pfad\zu\python.exe'
#     args: ['C:\Pfad\stt_server.py', '--uri', 'tcp://0.0.0.0:10300']
#     cwd: 'C:\Pfad'
#     health_tcp_port: 10300
#     startup_grace_s: 120
#   - name: ollama                              # Ollama selbst als Dienst-Kind statt Tray-App (laeuft dann schon vor der Anmeldung)
#     cmd: 'C:\Program Files\Ollama\ollama.exe'   # ADR-0085: nur in einem Ordner, den nur Administratoren aendern
#                                             #   koennen - das Kind laeuft als LocalSystem. Einen Benutzer-Install zieht
#                                             #   agent\Move-OllamaProtected.cmd in einem Schritt dorthin um
#     # user_writable_reason: '...'           # bewusste Ausnahme: startet trotz aenderbarem Ordner, Grund im Status
#     # run_as: localservice                  # ADR-0088, nur Windows: Standard; Ordnerrechte setzt der Agent selbst
#     # run_as: system                        #   bleibt auf LocalSystem, nur mit Grund:
#     # run_as_reason: '...'                  #   steht im Status und im Log
#     # read_paths: ['D:\models\strata']     # Ordner, die cmd/args/env/cwd nicht nennen (nur Lesen)
#     # write_paths: []                       # dito zum Schreiben
#     args: ['serve']
#     env:                                      # Benutzer-Umgebungsvariablen gelten fuer das Dienstkonto nicht -> hier setzen
#       - 'OLLAMA_HOST=127.0.0.1:11434'      # nur Loopback: der Agent erreicht Ollama ueber 127.0.0.1 (Tunnel und
#                                             #   ollama_proxy); alle Adressen machten Ollama am Router vorbei im Netz erreichbar (TM-11)
#       - 'OLLAMA_MODELS=C:\Users\<benutzer>\.ollama\models'         # + grant_modify; Lesen auf den Ollama-Programmordner
#       - 'USERPROFILE=C:\ProgramData\skirnir-agent\ollama-home' # ~/.ollama des Dienstes; + grant_modify
#       - 'OLLAMA_NUM_PARALLEL=2'
#     health_tcp_port: 11434
#     startup_grace_s: 60
#     # Achtung: die Tray-App 'ollama app.exe' dann nicht mehr autostarten lassen - sie startet sekuendlich einen eigenen Server
#     # Ollama-Updates macht dann der Router (Policy 'Ollama-Auto-Update' je Knoten, Nachtfenster); Block ollama_update: unten

install:                                        # nur Windows (Install-Service.ps1 / install / apply-rules)
  service_name: SkirnirAgent
  display_name: Skirnir Agent
  # description: ...
  account: ''                                   # '' = LocalSystem: noetig fuer den GPU-Schutz (Power-Limit setzen) und den direkten GPU-Z-Zugriff.
  # account: 'NT SERVICE\SkirnirAgent'    #   Virtuelles Konto: GPU-Schutz nur Beobachtung (zaehlt als HA-Problem), GPU-Z nur per Relay
  allow_control_users:
    - 'RECHNERNAME\benutzer'                    # darf den Dienst ohne Admin starten/stoppen (services.msc oder 'restart'); kein Recht auf das Config-Verzeichnis
  # grant_read: []                              # zusaetzliche Lesepfade fuer das Dienstkonto (z. B. Python fuer Kinder)
  # grant_modify: []                            # zusaetzliche Schreibpfade (z. B. ein OpenVINO-Cache)
  # firewall:                                   # eingehende Regeln nur fuer Kinder, die im LAN lauschen (der Tunnel braucht keine)
  #   - name: Wyoming STT (skirnir-agent)
  #     port: 10300
  #     program: 'C:\Pfad\zu\python.exe'
  #     remote: ['192.0.2.10']                  #   erlaubte Quell-IPs (leer = alle)
