# Skirnir router - minimal configuration for a first installation (ADR-0067).
#
# Easiest way: `python3 router.py --init /etc/skirnir-router` writes this file with a generated client token and your
# control password (asked without echo), then runs --check and --posture. To edit by hand instead, replace every
# REPLACE marker, then run:
#   python3 router.py --check   /etc/skirnir-router/config.yaml
#   python3 router.py --posture /etc/skirnir-router/config.yaml
# The full reference with every option is config.example.yaml next to this file.

router:
  listen: 0.0.0.0:11434            # API port for clients (Ollama, OpenAI and Anthropic APIs)
  control_listen: 0.0.0.0:11435    # agents' tunnel and the web UI; firewall it to your GPU nodes and admin machines
  public_url: https://router.example.net:11435   # REPLACE: the name your nodes and browser use to reach this router
  control_tls:                     # a certificate your nodes' and clients' operating systems trust (e.g. Let's Encrypt)
    cert: /etc/skirnir-router/certs/fullchain.pem
    key: /etc/skirnir-router/certs/privkey.pem
  api_tls: true                    # the API port uses the same certificate, so client tokens never cross the network in clear
  control_auth:
    users: {}                      # REPLACE: {admin: "<hash from: python3 router.py --hash>"}; without users the port answers 503
  client_auth:
    mode: enforce                  # requests without a valid token get 401
    locked: true                   # the mode can only change here, not in the UI
    clients:
      my-client:                   # one entry per client application; give each its own token
        token_sha256: "057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86"   # REPLACE: sha256 of the token ("changeme" here)
        roles: ["standard"]
        models: false              # only role names, no concrete model names (ADR-0052)
        requests_per_minute: 60

# Roles are the stable model names clients ask for ("standard:latest"). Each lists tiers in order of preference; the
# router picks the first one a free node can serve. Pull the model on your GPU node first: `ollama pull qwen3:8b`.
roles:
  standard:
    exposed_as: "standard:latest"
    tiers:
      - { model: "qwen3:8b", num_ctx: 8192 }

# Model catalog: memory a model needs on a GPU, so the router only picks a node where it fits. Starting values; the
# node reports real usage and config.example.yaml shows how to measure them.
models:
  "qwen3:8b":
    weights_gib: 5.2               # Q4_K_M weights
    kv_gib_per_1k: 0.14            # KV cache per 1000 tokens of context

modes: {}       # scheduler, busy detection and update settings keep their defaults (see config.example.yaml)
nodes: {}       # GPU nodes register themselves through the agent and are approved in the web UI
