version: 2
updates:
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
    groups:
      go-security-updates:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose   # image digests of the monitoring stack and the router compose example (ADR-0055)
    directories: [/monitoring, /router]
    schedule:
      interval: weekly
  - package-ecosystem: docker           # base image digests of the router image and the decision services (ADR-0055)
    directories: [/router, /decision-embed, /decision-jevlike]
    schedule:
      interval: weekly
