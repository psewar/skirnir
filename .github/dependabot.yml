version: 2
updates:
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
    groups:
      go-security-updates:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose   # image digests of the monitoring stack (ADR-0055)
    directory: /monitoring
    schedule:
      interval: weekly
  - package-ecosystem: docker           # base image digests of the optional decision services (ADR-0055)
    directories: [/decision-embed, /decision-jevlike]
    schedule:
      interval: weekly
