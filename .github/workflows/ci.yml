name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"   # nightly: the end-to-end suite is timing-sensitive, so it does not gate pushes
  workflow_dispatch:

jobs:
  python:
    name: Router lint, config check, self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt -r test/requirements-hindsight.txt
      - run: ruff check .
      - run: python router/router.py --check router/config.example.yaml --pure
      - name: Explicit control flow (AGENTS.md)
        run: python test/selftest_control_flow.py && python test/check_control_flow.py
      - run: python test/selftest_context_check.py
      - run: python test/selftest_english_names.py
      - run: python test/selftest_toolcall_rescue.py
      - run: python test/selftest_availability.py
      - run: python test/selftest_vram_real.py
      - run: python test/selftest_context_sharing.py
      - run: python test/selftest_children_vram.py
      - run: python test/selftest_ollama_push.py
      - run: python test/selftest_game_prewarm.py
      - run: python test/selftest_power.py
      - run: python test/selftest_standby_switch.py
      - run: python test/selftest_upstream_window.py
      - run: python test/selftest_server_while_standby.py
      - run: python test/selftest_cloud_errors.py
      - run: python test/selftest_config_load.py
      - run: python test/selftest_control_flow_admin.py
      - run: python test/selftest_control_flow_rest.py
      - run: python test/selftest_tunnel_cancel.py
      - run: python test/selftest_anthropic_messages.py
      - run: python test/selftest_keepalive.py
      - run: python test/selftest_max_parallel.py
      - run: python test/selftest_catalog_merge.py
      - run: python test/selftest_sessions.py
      - run: python test/selftest_memory.py
      - run: python test/selftest_rerank.py
      - run: python test/selftest_context.py
      - run: python test/selftest_interoperability.py
      - run: python test/selftest_reliability.py
      - run: python test/selftest_verified_delivery.py
      - run: python test/selftest_rerank_server.py
      - run: python test/selftest_slowness_signals.py
      - run: python test/selftest_openai_node.py
      - run: python test/selftest_openai_node_release.py
      - run: python test/selftest_openai_node_standby.py
      - run: python test/selftest_privacy_check.py
      - run: python test/integration_live_memory.py
      - run: python test/benchmark_context.py
      - name: Check added lines for common public-data leaks
        if: github.event_name == 'pull_request'
        env:
          PUBLIC_CHANGES_BASE: ${{ github.event.pull_request.base.sha }}
        run: python test/check_public_changes.py --base "$PUBLIC_CHANGES_BASE"

  sessions-postgres:
    name: Session store PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skirnir_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: skirnir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skirnir_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKIRNIR_TEST_SESSION_DSN: postgresql://skirnir_test:test-only@127.0.0.1:5432/skirnir_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r router/requirements-session.txt
      - run: python test/integration_sessions.py
      - run: python test/integration_context.py
      - run: python test/integration_interoperability.py

  go:
    name: Agent vet, test, Windows cross-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /dev/null .
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /dev/null .

  go-windows:
    # Der Agent laeuft produktiv als Windows-Dienst; Dateisperren und *_windows_test.go zeigen sich nur hier.
    name: Agent test on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: go test ./...

  e2e:
    name: Router end-to-end suite (nightly, informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python test/run_tests.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: test/*.log
          if-no-files-found: ignore
