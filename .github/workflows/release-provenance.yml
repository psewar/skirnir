name: Release provenance

# Rebuilds the agent binaries of a release from its tag, the way the release build does (clean export of agent/, the Go
# toolchain recorded in the published binary, CGO off, -trimpath, same ldflags), and compares them byte for byte with the
# published assets (ADR-0075). Equal: GitHub attests the build provenance of exactly those bytes and their SBOMs, and the
# CycloneDX SBOMs of the agent binaries and the router's Python requirements are attached to the release. Different: the
# job fails with both hashes, and nothing is attested. Verify:  gh attestation verify <file> --repo psewar/skirnir
# A release that ships the agent of an earlier release is rebuilt from the release that first published that agent
# version when the tag itself does not reproduce it (agent/ changed without a new agent, e.g. a dependency bump;
# ADR-0141). tools/security/rebuild_agent.sh does the rebuild and comparison; it comes from the workflow's own commit,
# so a manual run for an older tag works too.
# The router is released as source: the job router-source attaches skirnir-router-<version>.tar.gz, the router/ folder
# of the tag as git archive writes it, and attests its build provenance (ADR-0139), independent of the agent rebuild.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and attest (e.g. v0.31.0)
        required: true

permissions: {}

jobs:
  rebuild-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach the SBOMs to the release
      id-token: write       # sign the attestations
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0        # earlier release tags, to rebuild an agent first published there (ADR-0141)
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:                   # the rebuild script of the workflow's own commit, also for tags older than the script
          path: .workflow-tools
          sparse-checkout: tools/security/rebuild_agent.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the published agent binaries
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published --pattern 'skirnir-agent-*'
          ls -l published
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
      - name: Version and Go toolchain of the published binaries
        id: meta
        run: |
          set -euo pipefail
          lin=$(ls published/skirnir-agent-*-linux-amd64)
          ver=$(basename "$lin" | sed -E 's/^skirnir-agent-([0-9]+\.[0-9]+\.[0-9]+)-linux-amd64$/\1/')
          gov=$(go version "$lin" | awk '{print $2}')
          case "$ver" in *[!0-9.]*|"") echo "unexpected asset name $lin"; exit 1 ;; esac
          case "$gov" in go1.*) ;; *) echo "no Go version in $lin: $gov"; exit 1 ;; esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "go=${gov#go}" >> "$GITHUB_OUTPUT"
          echo "router=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' router/skirnir_router/common.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.meta.outputs.go }}
      - name: Release that first published this agent version
        id: origin
        env:
          V: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          origin=""
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt --jq 'sort_by(.createdAt) | .[].tagName'); do
            case "$t" in v[0-9]*.[0-9]*.[0-9]*) ;; *) continue ;; esac
            case "$t" in *[!v0-9.]*) continue ;; esac
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "skirnir-agent-$V-linux-amd64"; then
              origin=$t; break
            fi
          done
          echo "agent $V first published in ${origin:-this release}"
          echo "tag=${origin:-$TAG}" >> "$GITHUB_OUTPUT"
      - name: Rebuild and compare byte for byte (the tag, then the release that first published this agent version)
        env:
          V: ${{ steps.meta.outputs.version }}
          ORIGIN: ${{ steps.origin.outputs.tag }}
        run: |
          set -euo pipefail
          go version
          refs=(HEAD)
          [ "$ORIGIN" = "$TAG" ] || refs+=("$ORIGIN")
          bash .workflow-tools/tools/security/rebuild_agent.sh published rebuilt "$V" "${refs[@]}" | tee rebuild.log
          echo "Agent $V: $(tail -1 rebuild.log) (release $TAG)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: SBOMs (CycloneDX)
        env:
          RV: ${{ steps.meta.outputs.router }}
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci-lock.txt
          python tools/security/sbom.py agent --out-dir sbom rebuilt/skirnir-agent-*
          python tools/security/sbom.py router --version "$RV" --out "sbom/skirnir-router-$RV.cdx.json"
      - name: Attest build provenance of the identical binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rebuilt/skirnir-agent-*
      - name: Attest the Windows binary's SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: rebuilt/skirnir-agent-${{ steps.meta.outputs.version }}-windows-amd64.exe
          sbom-path: sbom/skirnir-agent-${{ steps.meta.outputs.version }}-windows-amd64.cdx.json
      - name: Attest the Linux binary's SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: rebuilt/skirnir-agent-${{ steps.meta.outputs.version }}-linux-amd64
          sbom-path: sbom/skirnir-agent-${{ steps.meta.outputs.version }}-linux-amd64.cdx.json
      - name: Attach the SBOMs to the release
        run: gh release upload "$TAG" sbom/*.cdx.json --repo "$GITHUB_REPOSITORY" --clobber

  router-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach the archive to the release
      id-token: write       # sign the attestation
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Router source archive of the tag
        id: archive
        run: |
          set -euo pipefail
          rv=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' router/skirnir_router/common.py)
          case "$rv" in *[!0-9.]*|"") echo "unexpected router version '$rv'"; exit 1 ;; esac
          mkdir -p router-archive
          git archive --format=tar.gz --prefix="skirnir-router-$rv/" -o "router-archive/skirnir-router-$rv.tar.gz" HEAD router
          sha256sum router-archive/*.tar.gz
          echo "path=router-archive/skirnir-router-$rv.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance of the router source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - name: Attach the router source archive to the release
        run: gh release upload "$TAG" router-archive/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
