name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r router/requirements.txt pip-audit
      - run: python test/selftest_security.py
      - name: Audit Python runtime dependencies
        run: pip-audit -r router/requirements.txt
  go-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Regenerate patched Go modules (temporary audit step)
        run: |
          go get github.com/eclipse/paho.mqtt.golang@v1.5.1 golang.org/x/net@latest
          go mod tidy
          echo SKIRNIR_GO_MOD_BEGIN
          base64 -w0 go.mod
          echo
          echo SKIRNIR_GO_MOD_END
          echo SKIRNIR_GO_SUM_BEGIN
          base64 -w0 go.sum
          echo
          echo SKIRNIR_GO_SUM_END
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
