name: Threat model gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Security review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python test/selftest_threat_review.py
      # The PR author comes from the GitHub event, not from commit metadata, so only real Dependabot PRs get the
      # dependency path (manifests and workflow `uses:` lines only, ADR-0047).
      - name: Validate current PR evidence (candidate checker)
        if: github.event_name == 'pull_request'
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        shell: bash
        run: |
          extra=(); [ "$REVIEW_DEPENDABOT" = true ] && extra=(--dependency-update)
          python tools/security/review.py check --base "$REVIEW_BASE" --head HEAD "${extra[@]}"
      # The step above runs the checker as the PR changed it; a PR could weaken it. This step runs the checker of the
      # base commit against the candidate's Git objects (no secrets in this job), so the required check stays trusted.
      - name: Validate current PR evidence (base branch checker)
        if: github.event_name == 'pull_request'
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        shell: bash
        run: |
          trusted="$RUNNER_TEMP/trusted"
          git -c core.hooksPath=/dev/null worktree add --detach "$trusted" "$REVIEW_BASE"
          if [ ! -f "$trusted/tools/security/review.py" ]; then
            echo "Base commit has no security checker yet (bootstrap PR): only the candidate checker ran."
            exit 0
          fi
          extra=(); [ "$REVIEW_DEPENDABOT" = true ] && extra=(--dependency-update)
          python -I "$trusted/tools/security/review.py" check --base "$REVIEW_BASE" --head "$(git rev-parse HEAD)" "${extra[@]}"
      - name: Validate baseline and expired acceptances
        if: github.event_name != 'pull_request'
        run: python tools/security/review.py check --base HEAD --head HEAD --baseline-only
