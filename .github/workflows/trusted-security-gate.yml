name: Independent security gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  verify:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check candidate objects with default-branch policy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -I tools/security/trusted_gate.py

  attest:
    needs: verify
    if: >-
      always() && needs.verify.outputs.eligible == 'true'
      && vars.SKIRNIR_GATE_PUBLISH == 'true'
    environment: security-gate-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint status-only installation token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SKIRNIR_GATE_APP_ID }}
          private-key: ${{ secrets.SKIRNIR_GATE_PRIVATE_KEY }}
          permission-statuses: write
      - name: Publish the independent result on the reviewed commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_HEAD: ${{ github.event.workflow_run.head_sha }}
          VERIFIED: ${{ needs.verify.result }}
        shell: bash
        run: |
          [[ "$REVIEW_HEAD" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          if [[ "$VERIFIED" == success ]]; then state=success; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$REVIEW_HEAD" \
            -f "state=$state" -f context=skirnir/trusted-security-review \
            -f description="Independent security review evidence" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
